{% extends 'gestion/principal.html' %}

{% block titulo %}Registro - Gestor ONG{% endblock %}

{% block contenido %}
<!-- Formulario Limpio con Habilidades y Horas agregados -->
<section class="py-5" style="background-color: #f8f9fa; min-height: 80vh;">
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow border-0 p-4" style="max-width: 480px; width: 100%; border-radius: 12px; background: #ffffff;">
      <h3 class="text-center mb-4 font-weight-bold" style="color: #232323;">
        Registro de {{ tipo }}
      </h3>

      <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="tipo" value="{{ tipo }}">

        <div class="form-group mb-3">
          <label class="font-weight-bold text-dark mb-1">Nombre Completo</label>
          <input type="text" name="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-group mb-3">
          <label class="font-weight-bold text-dark mb-1">Correo Electrónico</label>
          <input type="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
        </div>

        {% if tipo == 'Voluntario' %}
        <div class="form-group mb-3">
          <label class="font-weight-bold text-dark mb-1">Cédula de Identidad</label>
          <input type="text" name="cedula" class="form-control" required placeholder="Ej. 1712345678">
        </div>

        <div class="form-group mb-3">
          <label class="font-weight-bold text-dark mb-1">Habilidades</label>
          <input type="text" name="habilidades" class="form-control" required placeholder="Ej. Psicología, Logística, Docencia">
        </div>

        <div class="form-group mb-3">
          <label class="font-weight-bold text-dark mb-1">Horas Aportadas</label>
          <input type="number" name="horas_aportadas" class="form-control" value="5" min="1" required placeholder="Ej. 10">
        </div>
        {% else %}
        <div class="form-group mb-3">
          <label class="font-weight-bold text-dark mb-1">Monto a Donar ($)</label>
          <input type="number" name="monto" class="form-control" value="10" min="1" required>
        </div>
        {% endif %}

        <button type="submit" class="btn btn-block py-3 font-weight-bold text-white mt-4" style="background-color: #f7531d; border: none; border-radius: 6px; font-size: 16px;">
          Completar Registro
        </button>
      </form>
    </div>
  </div>
</section>

<!-- CDN y Disparador de SweetAlert2 al registrarse -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% if messages %}
  {% for message in messages %}
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        Swal.fire({
          icon: "{% if message.tags == 'error' or message.tags == 'danger' %}error{% else %}success{% endif %}",
          title: "{% if message.tags == 'error' or message.tags == 'danger' %}¡Atención!{% else %}¡Registro Exitoso!{% endif %}",
          text: "{{ message|escapejs }}",
          confirmButtonColor: "#f7531d",
          confirmButtonText: "Aceptar"
        });
      });
    </script>
  {% endfor %}
{% endif %}

{% endblock %}
