{% extends 'gestion/principal.html' %}

{% block titulo %}Registro de {{ tipo }}{% endblock %}

{% block contenido %}
<div class="container py-5 my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 shadow-sm rounded">
      <h2 class="text-center mb-4">Registro como {{ tipo }}</h2>
      
      <form method="POST">
        {% csrf_token %}
        <div class="form-group mb-3">
          <label>Nombre Completo</label>
          <input type="text" name="nombre" class="form-control" required placeholder="Tu nombre">
        </div>
        
        <div class="form-group mb-3">
          <label>Correo Electrónico</label>
          <input type="email" name="email" class="form-control" required placeholder="correo@ejemplo.com">
        </div>

        {% if tipo == 'Donante' %}
        <div class="form-group mb-4">
          <label>Monto de Donación ($)</label>
          <input type="number" name="monto" class="form-control" min="1" value="10" required>
        </div>
        {% else %}
        <div class="form-group mb-3">
          <label>Cédula de Identidad</label>
          <input type="text" name="cedula" class="form-control" required placeholder="1712345678">
        </div>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-block w-100" style="background-color: #f7531d; border-color: #f7531d;">
          Completar Registro
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
