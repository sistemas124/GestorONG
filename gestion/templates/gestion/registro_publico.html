<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestor ONG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow p-4" style="max-width: 450px; width: 100%; border-radius: 12px;">
        <h3 class="text-center mb-4 font-weight-bold">Registro como {{ tipo }}</h3>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="tipo" value="{{ tipo }}">

            <div class="mb-3">
                <label class="form-label text-muted">Nombre Completo</label>
                <input type="text" name="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="mb-3">
                <label class="form-label text-muted">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
            </div>

            {% if tipo == 'Voluntario' %}
            <div class="mb-3">
                <label class="form-label text-muted">Cédula de Identidad</label>
                <input type="text" name="cedula" class="form-control" required placeholder="Ej. 1712345678">
            </div>
            {% else %}
            <div class="mb-3">
                <label class="form-label text-muted">Monto a Donar ($)</label>
                <input type="number" name="monto" class="form-control" value="10" min="1" required>
            </div>
            {% endif %}

            <button type="submit" class="btn w-100 text-white font-weight-bold mt-2" style="background-color: #f7531d; border-radius: 6px;">
                Completar Registro
            </button>
        </form>
    </div>

    <!-- Script de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Captura de mensajes Django -> SweetAlert2 -->
    {% if messages %}
        {% for message in messages %}
            <script>
                Swal.fire({
                    icon: "{% if message.tags == 'error' %}error{% else %}success{% endif %}",
                    title: "{% if message.tags == 'error' %}¡Atención!{% else %}¡Registro Completado!{% endif %}",
                    text: "{{ message|escapejs }}",
                    confirmButtonColor: "#f7531d",
                    confirmButtonText: "Entendido"
                });
            </script>
        {% endfor %}
    {% endif %}

</body>
</html>
